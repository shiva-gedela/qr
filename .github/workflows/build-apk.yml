name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: mobile_app
        run: flutter pub get

      - name: Build Android APK
        working-directory: mobile_app
        run: flutter build apk --release --no-tree-shake-icons

      - name: Rename APK for release
        run: |
          cp mobile_app/build/app/outputs/flutter-apk/app-release.apk mobile_app/build/app/outputs/flutter-apk/QRouteX-v1.0.7.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QRouteX-v1.0.7-apk
          path: mobile_app/build/app/outputs/flutter-apk/*.apk

      - name: Publish GitHub Release v1.0.7
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.7
          name: "QRouteX v1.0.7 - Official Branded Logo Edition, Vendor Add & Direct Ride Booking"
          body: |
            ## QRouteX Mobile App (v1.0.7) • Official Branded Logo Edition • qroutex.com
            
            ### ✨ What's New in v1.0.7:
            - **Official User-Provided Logo Integration**:
              - Converted and processed the official Qroutex logo (Cyan, Blue, Purple & Flame-Orange dynamic 'Q' with integrated QR Code viewfinder reticle).
              - Updated all Android launcher mipmap densities (`mipmap-mdpi`, `mipmap-hdpi`, `mipmap-xhdpi`, `mipmap-xxhdpi`, `mipmap-xxxhdpi`) with square squircle and circular icons (`ic_launcher.png` and `ic_launcher_round.png`).
              - Replaced all in-app logo assets, app header emblem, sign-in badge, and web navbar branding with the official logo.
            - **Vendor Add Option (Event Services Registration)**:
              - Full Vendor Add wizard allowing catering, photography, decor, DJ, venue, and makeup vendors to register their profiles.
              - Live preview, service packages, direct Call & WhatsApp buttons.
              - Category filter chips (All, Catering, Photography, Decor, DJ, Venues, Makeup, Planners, Cakes).
            - **Direct Ride Booking (Uber • Rapido • Ola • Green SM)**:
              - Comprehensive Android `<queries>` intent declarations for all providers.
              - Multi-tier direct app opening with fallback to mobile web booking and Play Store.
            
            ### 📱 Android Installation Instructions:
            1. Download `QRouteX-v1.0.7.apk` directly to your Android device.
            2. If Android displays *"Blocked by Play Protect"* or *"Unrecognized App"*:
               - Tap **"More details"**
               - Tap **"Install anyway"**
            3. Open the app to experience the brand-new official logo and all features!
          files: |
            mobile_app/build/app/outputs/flutter-apk/QRouteX-v1.0.7.apk
            mobile_app/build/app/outputs/flutter-apk/app-release.apk
