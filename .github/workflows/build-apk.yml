name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: mobile_app
        run: flutter pub get

      - name: Build Android APK
        working-directory: mobile_app
        run: flutter build apk --release --no-tree-shake-icons

      - name: Rename APK for release
        run: |
          cp mobile_app/build/app/outputs/flutter-apk/app-release.apk mobile_app/build/app/outputs/flutter-apk/QRouteX-v1.0.2.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QRouteX-v1.0.2-apk
          path: mobile_app/build/app/outputs/flutter-apk/*.apk

      - name: Publish GitHub Release v1.0.2
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.2
          name: "QRouteX v1.0.2 - Smart Event QR & GPS Route Navigation"
          body: |
            ## QRouteX Mobile App (v1.0.2) • qroutex.com
            
            ### ✨ What's New in v1.0.2:
            - **Complete QRouteX Brand Upgrade**: Sleek new identity, modern iconography, and high-performance routing.
            - **All 6 Event Occasions Supported**:
              - 💍 Wedding
              - 🎂 Birthday
              - 💑 Engagement
              - ❤️ Anniversary
              - 🏠 Housewarming
              - 🎓 Graduation
            - **Turn-by-Turn GPS Navigation**: 1-tap route launch to Google Maps directly from any QR code or event card.
            - **Instant Offline Demo Mode**: Test all 6 occasions, invitations, and scanner without requiring backend connection.
            - **Dynamic Backend Server Switcher**: Easily connect to `https://qroutex.com`, your Render server, or local IP via the ⚙️ Settings dialog on the sign-in screen.
            
            ### 📱 Android Installation Instructions:
            1. Download `QRouteX-v1.0.2.apk` directly to your Android device.
            2. If Android displays *"Blocked by Play Protect"* or *"Unrecognized App"*:
               - Tap **"More details"**
               - Tap **"Install anyway"**
            3. Open the app and tap **"Explore in Offline Demo Mode"** to explore right away!
          files: |
            mobile_app/build/app/outputs/flutter-apk/QRouteX-v1.0.2.apk
            mobile_app/build/app/outputs/flutter-apk/app-release.apk
