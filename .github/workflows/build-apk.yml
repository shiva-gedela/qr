name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: mobile_app
        run: flutter pub get

      - name: Build Android APK
        working-directory: mobile_app
        run: flutter build apk --release --no-tree-shake-icons

      - name: Rename APK for release
        run: |
          cp mobile_app/build/app/outputs/flutter-apk/app-release.apk mobile_app/build/app/outputs/flutter-apk/QRouteX-v1.0.5.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QRouteX-v1.0.5-apk
          path: mobile_app/build/app/outputs/flutter-apk/*.apk

      - name: Publish GitHub Release v1.0.5
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.5
          name: "QRouteX v1.0.5 - Gallery QR Scanner, Turn-by-Turn GPS & Multi-Provider Ride Booking"
          body: |
            ## QRouteX Mobile App (v1.0.5) • Passvanta Edition • qroutex.com
            
            ### ✨ What's New in v1.0.5:
            - **Universal QR Scanner Enhancements**:
              - Instant full-screen camera launch with PhonePe-style glowing reticle.
              - **Scan QR from Gallery**: Pick and scan QR codes directly from photos and screenshots in your phone gallery.
              - Direct action buttons upon scan: Open URL, Google Maps GPS Turn-by-Turn Navigation, or Book Ride.
            - **Event Location & Navigation**:
              - Real-time GPS pickup point detection with ability to change pickup point.
              - Event destination display with venue name, address, distance (km), and estimated travel time (ETA in mins).
              - Direct **Start Google Maps Turn-by-Turn GPS Directions** integration.
            - **Multi-Provider Ride Booking**:
              - Support for **Uber, Rapido, Ola, and Green SM** (100% Eco Green Electric Vehicles).
              - Vehicle categories: 🛵 Bike Taxi, 🛺 Auto Rickshaw, 🚗 AC Cabs & Sedans, ⚡ Green SM Electric EV.
              - Deep link buttons with direct app launching and web portal fallback.
            - **Fare Comparison Engine**:
              - Calculated fare estimates in ₹ based on transit distance and duration.
              - "Cheapest", "Fastest", "Popular", and "100% Eco Green" badges.
              - "Check Fare in App" toggle to compare real-time dynamic surge prices directly in official ride apps.
              - Share ETA and live navigation via WhatsApp to event hosts and friends.
            
            ### 📱 Android Installation Instructions:
            1. Download `QRouteX-v1.0.5.apk` directly to your Android device.
            2. If Android displays *"Blocked by Play Protect"* or *"Unrecognized App"*:
               - Tap **"More details"**
               - Tap **"Install anyway"**
            3. Open the app to experience the brand-new QR Scanner, GPS Routing, and Ride Booking!
          files: |
            mobile_app/build/app/outputs/flutter-apk/QRouteX-v1.0.5.apk
            mobile_app/build/app/outputs/flutter-apk/app-release.apk
