name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: mobile_app
        run: flutter pub get

      - name: Build Android APK
        working-directory: mobile_app
        run: flutter build apk --release --no-tree-shake-icons

      - name: Rename APK for release
        run: |
          cp mobile_app/build/app/outputs/flutter-apk/app-release.apk mobile_app/build/app/outputs/flutter-apk/QRouteX-v1.0.6.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QRouteX-v1.0.6-apk
          path: mobile_app/build/app/outputs/flutter-apk/*.apk

      - name: Publish GitHub Release v1.0.6
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.6
          name: "QRouteX v1.0.6 - Official App Logo, Vendor Add Registration & Direct Ride Booking"
          body: |
            ## QRouteX Mobile App (v1.0.6) • Passvanta Edition • qroutex.com
            
            ### ✨ What's New in v1.0.6:
            - **Official App Logo & HD Launcher Icons**:
              - Custom designed high-resolution QRouteX app logo (Royal Purple, Gold Compass, GPS Navigation Pin & QR dot matrix).
              - Generated full set of Android mipmap launcher icons (`mdpi`, `hdpi`, `xhdpi`, `xxhdpi`, `xxxhdpi`, and adaptive round icon).
              - Integrated official logo badge into the Home header and Sign In screens.
            - **Vendor Add Option (Business Profile Registration)**:
              - Added "+ Add Vendor" option in the Vendors & Services section and floating button.
              - Dedicated 3-step Vendor Registration form: Category (Catering, Photography, Decoration, DJ & Sound, Venues, Makeup, Planners, Bakeries), Contact & Location, Pricing & Packages.
              - Live vendor card preview that updates dynamically as you type.
              - Category filter bar (All, 🍽️ Catering, 📸 Photography, 🎨 Decor, 🎵 DJ, 🏰 Venues, 💄 Makeup, 📋 Planners, 🎂 Cakes) and instant keyword search.
              - 1-tap direct Call and WhatsApp chat buttons on all vendor cards.
            - **Direct Ride Booking Fixes & Deep Linking**:
              - Added comprehensive Android `<queries>` permissions for Uber (`com.ubercab`), Rapido (`com.rapido.passenger`), Ola (`com.olacabs.customer`), and Green SM (`com.blusmart`).
              - Fixed URI encoding for destination coordinates and addresses across all providers.
              - Multi-tier intelligent launch: Native App Intent ➔ Web Universal Link ➔ Google Play Store Market Fallback ➔ Interactive Ride Options Modal.
              - Guaranteed 100% reliable booking whether the cab app is installed or not.
            
            ### 📱 Android Installation Instructions:
            1. Download `QRouteX-v1.0.6.apk` directly to your Android device.
            2. If Android displays *"Blocked by Play Protect"* or *"Unrecognized App"*:
               - Tap **"More details"**
               - Tap **"Install anyway"**
            3. Open the app to experience the brand-new app logo, vendor registration, and direct ride booking!
          files: |
            mobile_app/build/app/outputs/flutter-apk/QRouteX-v1.0.6.apk
            mobile_app/build/app/outputs/flutter-apk/app-release.apk
