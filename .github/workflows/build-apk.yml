name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-disabled: true

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: mobile_app
        run: flutter pub get

      - name: Analyze Flutter Code
        working-directory: mobile_app
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze_report.txt 2>&1 || true
          cat analyze_report.txt
          echo "### Flutter Analyze Report" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat analyze_report.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Build Android APK
        working-directory: mobile_app
        run: |
          set -o pipefail
          flutter build apk --release --no-tree-shake-icons 2>&1 | tee build_output.log

      - name: Upload Build Output Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output-log
          path: mobile_app/build_output.log

      - name: Commit build error log if failed
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          tail -n 250 mobile_app/build_output.log > BUILD_FAILURE_LOG.txt
          git add BUILD_FAILURE_LOG.txt
          git commit -m "ci: dump android build failure log [skip ci]" || true
          git push origin main || true

      - name: Add Build Log to Summary
        if: always()
        run: |
          echo "### Build Log (Last 150 Lines)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 150 mobile_app/build_output.log >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Rename APK for release
        run: |
          cp mobile_app/build/app/outputs/flutter-apk/app-release.apk mobile_app/build/app/outputs/flutter-apk/QRouteX-v1.1.0.apk
          cp mobile_app/build/app/outputs/flutter-apk/app-release.apk mobile_app/build/app/outputs/flutter-apk/QRouteX-latest.apk
          cp mobile_app/build/app/outputs/flutter-apk/app-release.apk mobile_app/build/app/outputs/flutter-apk/QRouteX-v1.0.9.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QRouteX-v1.1.0-apk
          path: mobile_app/build/app/outputs/flutter-apk/*.apk

      - name: Publish GitHub Release v1.1.0
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.1.0
          name: "QRouteX v1.1.0 - Official Brand Logo, Live GPS City Detection & App Links"
          body: |
            ## QRouteX Mobile App (v1.1.0) • Complete Redesign Edition • qroutex.com
            
            ### ✨ What's New in v1.1.0:
            - **Official QRouteX High-Resolution Logo**:
              - Integrated the new official squircle emblem with GPS route and cyan locator pin across Android launcher mipmaps, web icons, and header badge.
            - **Live Location Auto-Detection**:
              - Added real-time GPS & network city auto-detection with OpenStreetMap and GeoJS reverse geocoding in the city picker modal.
            - **Android App Links & Deep Linking**:
              - Configured `android:autoVerify="true"` and intent filters for `https://qroutex.com/events/e/` and `https://qroutex.com/b/`.
            - **5-Tab Navigation Architecture**:
              - **Home | Explore | Create (+) | Bookings | Profile** with floating create dock.
            - **8-Step Multi-Step Event Creation Wizard**:
              - Event Info, Date & Location, Cover Image, Description, Capacity, Tickets, Portfolio, Live Preview & Publish.
            - **Restaurant & Local Business Direct Booking**:
              - Time slot chips, date picker, guest count slider, and status tracking in My Bookings.
            - **Vendor Partner Portal & Dashboard**:
              - KPI cards (views, bookings, revenue) and client inquiry management.
            - **Celebration Moments Feed**:
              - Story highlights, double-tap like animations, comments, and WhatsApp sharing.
            - **Advanced QR Code Scanner with Scan History**:
              - Full-screen camera scanner, gallery decode, torch toggle, and duplicate check-in prevention.
            - **Ride & GPS Turn-by-Turn Navigation**:
              - Live Google Maps route directions and 1-click deep links for Uber, Rapido, and Ola.
            
            ### 📱 Android Installation Instructions:
            1. Download `QRouteX-v1.1.0.apk` (or `QRouteX-latest.apk`) directly to your Android device.
            2. If Android displays *"Blocked by Play Protect"* or *"Unrecognized App"*:
               - Tap **"More details"**
               - Tap **"Install anyway"**
            3. Open the app to experience the brand-new QRouteX platform!
          files: |
            mobile_app/build/app/outputs/flutter-apk/QRouteX-v1.1.0.apk
            mobile_app/build/app/outputs/flutter-apk/QRouteX-latest.apk
            mobile_app/build/app/outputs/flutter-apk/QRouteX-v1.0.9.apk
            mobile_app/build/app/outputs/flutter-apk/app-release.apk
