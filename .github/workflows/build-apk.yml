name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-disabled: true

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: mobile_app
        run: flutter pub get

      - name: Analyze Flutter Code
        working-directory: mobile_app
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze_report.txt 2>&1 || true
          cat analyze_report.txt
          echo "### Flutter Analyze Report" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat analyze_report.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Build Android APK
        working-directory: mobile_app
        run: |
          set -o pipefail
          flutter build apk --release --no-tree-shake-icons 2>&1 | tee build_output.log

      - name: Upload Build Output Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output-log
          path: mobile_app/build_output.log

      - name: Publish Build Failure Release
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.9-build-log
          name: "Build Failure Log"
          body_path: mobile_app/build_output.log
          files: mobile_app/build_output.log

      - name: Rename APK for release
        run: |
          cp mobile_app/build/app/outputs/flutter-apk/app-release.apk mobile_app/build/app/outputs/flutter-apk/QRouteX-v1.0.9.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QRouteX-v1.0.9-apk
          path: mobile_app/build/app/outputs/flutter-apk/*.apk

      - name: Publish GitHub Release v1.0.9
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.9
          name: "QRouteX v1.0.9 - Complete UI/UX Redesign, Official Brand Logo, 5-Tab Navigation, & Moments Feed"
          body: |
            ## QRouteX Mobile App (v1.0.9) • Complete Redesign Edition • qroutex.com
            
            ### ✨ What's New in v1.0.9:
            - **Official QRouteX High-Resolution Logo**:
              - Integrated official high-res QRouteX logo across Android launcher mipmaps, app header, and digital invitations.
            - **5-Tab Navigation Architecture**:
              - **Home | Explore | Create (+) | Bookings | Profile**
              - Docked center Floating Action Button with interactive quick actions modal (Create Event, Scan QR, Book Service, Share Moment, Add Vendor).
            - **8-Step Multi-Step Event Creation Wizard**:
              - 1. Event Information, 2. Date, Time & Venue, 3. Cover Image, 4. Story & Description, 5. Guest Capacity, 6. Entry & QR Settings, 7. Event Portfolio, 8. Interactive Live Preview & Publish.
            - **Restaurant & Local Business Direct Booking**:
              - Full booking module with date picker, time slot chips, guest count slider, and status tracking in My Bookings.
            - **Vendor Partner Portal & Dashboard**:
              - Dedicated dashboard with key performance indicators (views, bookings, revenue) and client inquiry management.
            - **Social Moments Feed**:
              - Celebration feed with story highlights, double-tap like animations, comments, and WhatsApp sharing.
            - **Advanced QR Code Scanner with Scan History**:
              - Full-screen scanner, gallery screenshot scanning, camera torch toggle, attendance scan history, and Google / Apple wallet passes.
            - **Ride & GPS Turn-by-Turn Navigation**:
              - Live route directions and instant deep-linking for Uber, Rapido, and Ola.
            
            ### 📱 Android Installation Instructions:
            1. Download `QRouteX-v1.0.9.apk` directly to your Android device.
            2. If Android displays *"Blocked by Play Protect"* or *"Unrecognized App"*:
               - Tap **"More details"**
               - Tap **"Install anyway"**
            3. Open the app to experience the brand-new QRouteX platform!
          files: |
            mobile_app/build/app/outputs/flutter-apk/QRouteX-v1.0.9.apk
            mobile_app/build/app/outputs/flutter-apk/app-release.apk
