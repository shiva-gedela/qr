name: qroutex
description: "QRouteX - Smart Event QR & Turn-by-Turn GPS Navigation App (qroutex.com)"
publish_to: 'none'
version: 1.0.9+9

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Networking & REST API
  http: ^1.2.1
  shared_preferences: ^2.2.3

  # QR Code Scanning & Generation
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.1.1

  # Media & Utilities
  image_picker: ^1.1.0
  url_launcher: ^6.2.6
  intl: ^0.19.0
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
