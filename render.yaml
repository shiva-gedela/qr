databases:
  - name: eventconnect-db
    databaseName: eventconnect_db
    user: eventconnect_user
    plan: free

services:
  - type: web
    name: eventconnect-qr
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn eventconnect.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: eventconnect-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "localhost,127.0.0.1,.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
