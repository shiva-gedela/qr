{% extends 'base.html' %}
{% block title %}Reset Password - {{ SITE_NAME }}{% endblock %}
{% block content %}
<div class="min-vh-100 d-flex align-items-center py-5" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="card border-0 shadow-lg rounded-4">
                    <div class="card-header bg-primary text-white text-center py-4 border-0">
                        <i class="bi bi-lock-fill display-6 text-warning mb-2 d-block"></i>
                        <h3 class="fw-bold mb-1">Reset Password</h3>
                        <p class="text-white-75 small mb-0">Enter your email to receive a reset link.</p>
                    </div>
                    <div class="card-body p-4">
                        {% load crispy_forms_tags %}
                        <form method="post">{% csrf_token %}{% crispy form %}</form>
                        <div class="text-center mt-3">
                            <a href="/accounts/login/" class="text-muted small"><i class="bi bi-arrow-left me-1"></i>Back to Login</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
