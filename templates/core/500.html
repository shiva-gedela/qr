{% extends 'base.html' %}
{% block title %}500 - Server Error | {{ SITE_NAME }}{% endblock %}

{% block content %}
<div class="min-vh-100 d-flex align-items-center text-center py-5 position-relative overflow-hidden" style="background: radial-gradient(circle at 50% 40%, #1E1B4B 0%, #0F172A 70%, #090D16 100%); color: white;">
    <div class="container position-relative" style="z-index: 2;">
        <div class="rounded-circle bg-danger text-white d-inline-flex align-items-center justify-content-center mb-4 shadow" style="width: 84px; height: 84px;">
            <i class="bi bi-exclamation-triangle-fill fs-1"></i>
        </div>
        <h1 class="display-1 fw-bold text-danger mb-2 font-monospace">500</h1>
        <h2 class="fw-bold mb-3">Something Went Wrong</h2>
        <p class="text-white-75 lead mb-4 mx-auto" style="max-width: 520px;">
            Our servers encountered a temporary issue while processing your request. Please try again in a few moments.
        </p>
        <div class="d-flex gap-3 justify-content-center flex-wrap">
            <a href="/" class="btn btn-primary btn-lg px-4 rounded-pill fw-bold shadow-lg">
                <i class="bi bi-house me-2"></i>Back to Home
            </a>
            <button onclick="location.reload()" class="btn btn-outline-light btn-lg px-4 rounded-pill">
                <i class="bi bi-arrow-repeat me-2"></i>Retry
            </button>
        </div>
    </div>
</div>
{% endblock %}
