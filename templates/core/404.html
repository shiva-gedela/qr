{% extends 'base.html' %}
{% block title %}404 - Page Not Found | {{ SITE_NAME }}{% endblock %}

{% block content %}
<div class="min-vh-100 d-flex align-items-center text-center py-5 position-relative overflow-hidden" style="background: radial-gradient(circle at 50% 40%, #1E1B4B 0%, #0F172A 70%, #090D16 100%); color: white;">
    <div class="container position-relative" style="z-index: 2;">
        <div class="rounded-circle bg-warning text-dark d-inline-flex align-items-center justify-content-center mb-4 shadow" style="width: 84px; height: 84px;">
            <i class="bi bi-geo-alt-fill fs-1"></i>
        </div>
        <h1 class="display-1 fw-bold text-warning mb-2 font-monospace">404</h1>
        <h2 class="fw-bold mb-3">Destination Not Found</h2>
        <p class="text-white-75 lead mb-4 mx-auto" style="max-width: 520px;">
            The event pass, digital card, or route link you are looking for has moved or does not exist.
        </p>
        <div class="d-flex gap-3 justify-content-center flex-wrap">
            <a href="/" class="btn btn-warning btn-lg px-4 rounded-pill fw-bold shadow-lg">
                <i class="bi bi-house me-2"></i>Back to Home
            </a>
            <button onclick="history.back()" class="btn btn-outline-light btn-lg px-4 rounded-pill">
                <i class="bi bi-arrow-left me-2"></i>Go Back
            </button>
        </div>
    </div>
</div>
{% endblock %}
