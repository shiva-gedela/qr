{% extends 'base.html' %}
{% block title %}404 Not Found - {{ SITE_NAME }}{% endblock %}
{% block content %}
<div class="min-vh-100 d-flex align-items-center text-center py-5">
    <div class="container">
        <div class="display-1 mb-3">🔍</div>
        <h1 class="display-3 fw-bold text-primary">404</h1>
        <h2 class="mb-3">Page Not Found</h2>
        <p class="text-muted lead mb-4">The page you're looking for doesn't exist or the event link may have changed.</p>
        <div class="d-flex gap-3 justify-content-center">
            <a href="/" class="btn btn-primary px-4"><i class="bi bi-house me-2"></i>Go Home</a>
            <button onclick="history.back()" class="btn btn-outline-secondary px-4"><i class="bi bi-arrow-left me-2"></i>Go Back</button>
        </div>
    </div>
</div>
{% endblock %}
