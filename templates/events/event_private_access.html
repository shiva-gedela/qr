{% extends 'base.html' %}
{% block title %}Private Event - {{ SITE_NAME }}{% endblock %}
{% block content %}
<div class="min-vh-100 d-flex align-items-center py-5" style="background: linear-gradient(135deg, #6c3483 0%, #a569bd 100%);">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card border-0 shadow-lg rounded-4">
                    <div class="card-header bg-primary text-white text-center py-4 border-0">
                        <i class="bi bi-lock-fill display-4 text-warning mb-2 d-block"></i>
                        <h3 class="fw-bold mb-1">{{ event.title }}</h3>
                        <p class="text-white-75 mb-0">This is a private event. Enter the password to continue.</p>
                    </div>
                    <div class="card-body p-4">
                        {% if messages %}{% for msg in messages %}
                        <div class="alert alert-danger">{{ msg }}</div>
                        {% endfor %}{% endif %}
                        <form method="post">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Event Password</label>
                                <input type="password" name="password" class="form-control form-control-lg" required autofocus>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">
                                <i class="bi bi-unlock me-2"></i>Access Event
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
