{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Edit Product/Service - {{ business.name }}{% endblock %}

{% block content %}
<div class="bg-light py-4 border-bottom">
    <div class="container d-flex justify-content-between align-items-center flex-wrap gap-3">
        <div>
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb mb-1">
                    <li class="breadcrumb-item"><a href="{% url 'business_list' %}">Businesses</a></li>
                    <li class="breadcrumb-item"><a href="{% url 'business_detail' pk=business.pk %}">{{ business.name }}</a></li>
                    <li class="breadcrumb-item active">Edit Item</li>
                </ol>
            </nav>
            <h2 class="fw-bold mb-0"><i class="bi bi-tag text-primary me-2"></i>Edit Product / Service</h2>
        </div>
        <a href="{% url 'business_detail' pk=business.pk %}" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left me-1"></i>Back to Business
        </a>
    </div>
</div>

<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card border-0 shadow-sm">
                <div class="card-body p-4 p-md-5">
                    <form method="post" enctype="multipart/form-data" novalidate>
                        {% csrf_token %}
                        {% crispy form %}
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
